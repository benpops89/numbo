<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bingo Caller</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <div class="layout">
        <aside class="panel">
          <div id="number">--</div>
          <div id="phrase" class="muted">Press "Call next" to start</div>
          <div id="remaining" class="muted"></div>
          <div class="controls">
            <button id="callBtn">Call next</button>
            <button id="resetBtn" class="secondary">Reset</button>
            <label class="auto">
              <input type="checkbox" id="autoToggle" /> Auto
            </label>
            <label class="interval">
              every
              <input type="number" id="interval" min="1" max="60" value="5" />
              s
            </label>
          </div>
        </aside>
        <section id="grid" aria-label="Called numbers"></section>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
