<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bingo Caller</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Bingo Caller</h1>
        <span id="remaining" class="muted"></span>
      </header>

      <section id="current">
        <div id="number">--</div>
        <div id="phrase" class="muted">Press "Call next" to start</div>
      </section>

      <section id="controls">
        <button id="callBtn">Call next (Space)</button>
        <label class="auto">
          <input type="checkbox" id="autoToggle" /> Auto
        </label>
        <label class="interval">
          every
          <input type="number" id="interval" min="1" max="60" value="5" />
          s
        </label>
        <button id="resetBtn">Reset</button>
      </section>

      <section id="grid" aria-label="Called numbers"></section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
