<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bingo Caller</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <section id="grid" aria-label="Called numbers"></section>
      <div id="current" class="hidden">
        <div id="number">--</div>
        <div id="phrase"></div>
      </div>
      <div class="strip">
        <span id="remaining" class="muted"></span>
        <button id="callBtn">Call next</button>
        <label class="auto"><input type="checkbox" id="autoToggle" /> Auto</label>
        <label class="interval">every <input type="number" id="interval" min="1" max="60" value="5" /> s</label>
        <button id="resetBtn" class="secondary">Reset</button>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
